schema_version: 1

frames:
  world: world
  pallet: pallet
  conveyor: conveyor
  robot_base: robot_base
  camera_2d: camera_2d
  camera_3d: camera_3d
  gripper: gripper

# Gazebo V4.2 layout (ros2_ws/src/pac_simulation/worlds/
# ahead_workcell_v4_2_physical_scale.sdf, also used by V4.3-V4.5).
# Demo coordinates, not claimed field dimensions. Pallet footprint / deck
# height must equal config/default.yaml `pallet:` (tests/test_config_consistency.py).
layout:
  world_file: ahead_workcell_v4_2_physical_scale.sdf
  robot_base_world_m: [0.0, 0.0, 0.0]          # HDR50-22 on hdr50_pedestal
  conveyor:
    center_world_m: [-2.80, 1.20, 0.84]
    length_m: 4.00
    width_m: 0.76                               # between side rails
    roller_top_z_m: 0.895
  inline_scale:
    center_world_m: [-3.80, 1.20, 0.755]
  pick_zone:
    center_world_m: [-1.08, 1.20, 0.895]       # V4.3 stop position, roller top
  pallet:
    center_world_m: [0.0, 1.20, 0.075]         # wood centre; deck top z = 0.15
    size_m: [1.10, 1.10, 0.15]
  buffer_rack:
    center_world_m: [1.45, -0.55, 0.0]
  top_camera:
    position_world_m: [-0.60, 1.78, 2.40]
    topic: /pac/top_camera/image

simulation:
  observation_mode: ground_truth
