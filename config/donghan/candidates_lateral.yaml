# Stage 5-1 (candidate generation) / 5-2 (hard mask) settings -- team defaults (config/taehyeon/candidates.yaml) + step 13 lateral stability -- owner of the lateral section: donghan
# SI units: m, kg, N, rad. Development defaults; reasons in docs/taehyeon/hard_mask.md.
# Robot: HDR50-22 (robot reach/IK/payload are stage 6, not checked here).
schema_version: 1
candidates:
  cache_size: 256
  generation:
    yaw_set_rad: [0.0, 1.5707963267948966]   # 1st stage: 0 / 90 deg
    use_ems: true
    use_extreme_points: true
    ems_anchors: [corner_ll, corner_lr, corner_ul, corner_ur, center]
    balance_anchors: true                     # share mode: scan EMS for load-balanced spots of heavy boxes
    balance_step_m: 0.04                      # scan grid of the balance anchors
    dedup_distance_m: 0.08                    # 80 mm duplicate removal
    dedup_mode: support_aware                 # geometric | support_aware | mask_aware | off
    order: likely_valid_first                 # priority | likely_valid_first
    max_candidates: 0                         # 0 = unlimited
  uncertainty:                                # measurement uncertainty delta (from stage 2)
    lateral_clearance_m: 0.004
    size_tolerance_m: 0.002
    height_tolerance_m: 0.003
    cog_uncertainty_ratio: 0.05
    cog_uncertainty_min_m: 0.005
    uncertain_policy: robust                  # robust | reject
    uncertain_multiplier: 2.0
  constraints:
    min_support_ratio: 0.70
    min_lbcp_margin_m: 0.0
    pallet_overhang_m: 0.0
    default_pallet_max_weight_kg: 1000.0
    # 2026-10-09: the mission item "never put a heavier box on a lighter one" was
    # withdrawn. Crushing (box top-load capacity, McKee x safety factor 4 =
    # BOX_CAPACITY) and collapse (support ratio, LBCP, pallet CoG) stay checked.
    heavy_on_light:
      enabled: false
      mode: share                             # share (taehyeon 2026-10-08) | per_box (mission wording)
      max_weight_ratio: 1.0
      tolerance_kg: 0.5
      min_share: 0.10
    load_model:
      ect_n_per_m: 5000.0
      board_thickness_m: 0.003
      safety_factor: 4.0
      share_model: lever                      # lever | area
    pallet_cog:
      enabled: true
      final_half_extent_ratio: 0.5
      ramp_mass_kg: 150.0
      allow_improving: true
    # Step 13 (docs/donghan/lateral_stability.md): the unwrapped load must stay at
    # rest under 0.25 g sideways. geom -> force-equilibrium LP -> short tilt test.
    lateral:
      enabled: true
      accel_g: 0.25
      directions: 8                           # +-x, +-y and diagonals
      mu_box_box: 0.4                         # team value (STABILITY_0_3G_BASIS, conservative of 0.3-0.5)
      mu_box_pallet: 0.4                      # carton on wood = carton on carton 0.5 (CTU Code), same conservative 0.4
      deck: slatted                           # plywood top boards along X, as config/ahead_simulator.yaml
      deck_board_count: 5                     # 96 mm gaps
      deck_board_width_ratio: 0.13            # 143 mm boards
      side_contact_gap_m: 0.010
      band_low_g: 0.25                        # LP below: reject (not calibrated, see the doc)
      band_high_g: 0.30                       # LP at/above: pass; between: tilt test (0.25 x 0.35/0.3)
      borderline: simulate                    # simulate | reject | accept (no pybullet -> reject)
      sim_max_bodies: 15                      # larger borderline systems are rejected without simulating
      sim_directions: 1
      sim_ramp_s: 0.10
      sim_hold_s: 0.30
      sim_disp_tol_m: 0.010
      sim_tilt_tol_deg: 3.0
      sim_speed_tol_m_s: 0.02
