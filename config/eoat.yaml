schema_version: 1

eoat:
  model: vacuum_gripper_v1
  type: vacuum_multi_suction

  # EOAT stays independent from the robot. Only the mount frame changes per robot.
  robot_mount:
    hdr50_22:
      parent_frame: flange
      mount_xyz_m: [0.0, 0.0, 0.0]
      mount_rpy_rad: [0.0, 0.0, 0.0]
    hdp160_31:
      parent_frame: null
      mount_xyz_m: null
      mount_rpy_rad: null

  tcp:
    frame_id: vacuum_tcp
    # Tool length is a SIMULATION design parameter until a real EOAT is selected.
    offset_from_mount_m: [0.0, 0.0, 0.22]

  suction_array:
    rows: 2
    columns: 2
    spacing_x_m: 0.14
    spacing_y_m: 0.10
    cup_radius_m: 0.035

  grasp_policy:
    top_surface_only: true
    require_box_top_area_fit: true
    attach_backend: gazebo_detachable_joint
    vacuum_feedback_mode: simulated

  physical_parameters:
    tool_mass_kg: null
    tool_com_m: null
    max_supported_workpiece_kg: null
