schema_version: 2

robot:
  # Final competition / field target.
  target_model: hdp160_31
  target_vendor: HD Hyundai Robotics

simulation:
  # Public ROS 2 / Gazebo supported proxy used during software integration.
  proxy_model: hdr50_22
  proxy_vendor: HD Hyundai Robotics
  proxy_is_final_target: false
  proxy_reason: public_ros2_gazebo_moveit_support

  # The proxy has 6 DOF, but AHEAD deliberately commands it like a palletizer
  # so that the algorithmic interface can later map to HDP160-31 with less churn.
  palletizer_emulation:
    enabled: true
    command_space: [x, y, z, yaw]
    lock_roll_rad: 0.0
    lock_pitch_rad: 0.0
    vertical_approach: true
    vertical_retreat: true

  hdr50_22:
    moveit_group: hdr_manipulator
    base_frame: base_link
    flange_frame: flange
    tcp_frame: vacuum_tcp
    # Official product nominal values; these are metadata, not direct box limits.
    nominal_payload_kg: 50.0
    nominal_reach_m: 2.239

robot_feasibility:
  # Never decide workpiece validity from nominal payload alone.
  require_state_version_match: true
  require_reachability: true
  require_ik: true
  require_robot_collision_check: true
  require_approach_check: true
  require_retreat_check: true
  require_eoat_clearance: true

hdp160_31:
  # Kept as the final adapter target, but no fabricated kinematics are stored here.
  description_status: unavailable_in_public_hdr_repos_as_of_2026_10_07
  tool_mass_kg: null
  tool_com_m: null
  inertia_limits: null

sources:
  official_description_repo: https://github.com/hyundai-robotics/hdr_description
  official_driver_repo: https://github.com/hyundai-robotics/hdr_ros2_driver
  official_gazebo_repo: https://github.com/hyundai-robotics/hdr_simulation_gz
