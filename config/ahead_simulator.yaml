pallet:
  # length_m / width_m / deck_height_m / max_height_m (cargo height above the
  # deck) come from config/default.yaml `pallet:`; add them here only to
  # override for an experiment.

  # Development collision geometry, not an official pallet specification.
  # Replace these values when the actual competition pallet geometry is known.
  # Block pallet (T-11 style), same as the Gazebo V4.4 world (2026-10-09): bottom boards 22 mm,
  # 9 blocks 145 x 145 x 71 mm, 3 cross boards 145 x 22 mm, 5 top boards 143 x 35 mm (96 mm gap);
  # ratios of 1.10 m (widths) and of the 0.15 m deck height (thicknesses).
  collision_model: "slatted"
  top_board_count: 5
  top_board_width_ratio: 0.13
  top_board_thickness_ratio: 0.2333
  stringer_board_count: 3
  stringer_board_width_ratio: 0.1318
  stringer_board_thickness_ratio: 0.1467
  support_block_count_x: 3
  support_block_count_y: 3
  support_block_length_ratio: 0.1318
  support_block_width_ratio: 0.1318
  support_block_height_ratio: 0.4733
  bottom_board_count: 3
  bottom_board_width_ratio: 0.1318
  bottom_board_thickness_ratio: 0.1467

physics:
  gravity_m_s2: 9.80665
  physics_hz: 240
  server_loop_hz: 60
  viewer_hz: 30
  solver_iterations: 100
  rolling_friction: 0.001
  spinning_friction: 0.01
  restitution: 0.02
  spawn_clearance_m: 0.002

  # These are TARGET COMBINED Coulomb friction values at each contact.
  # Bullet combines two body friction values by multiplication.
  # 0.64 and 0.72 preserve the current development behavior:
  # box body=0.8, pallet body=0.9 -> 0.8*0.8=0.64, 0.8*0.9=0.72.
  # They are NOT measured carton/pallet constants.
  target_box_box_friction: 0.64
  target_box_pallet_friction: 0.72

metrics:
  load_grid_size: 20
  contact_display_min_force_n: 0.05

  # Average contact forces over simulation time to reduce solver/contact jitter.
  contact_force_average_window_s: 0.50

server:
  host: "127.0.0.1"
  port: 4173
