schema_version: 1
# Stage 6 robot feasibility (taehyeon). Kinematics: official hdr_description URDF.
# Cell = the team workcell (config/workcell.yaml, Gazebo V4.2-V4.5); the values must
# agree with it (tests/test_config_consistency.py). ASSUMPTION = replace when the real
# cell / gripper is known.
robot_check:
  robot_model: hdr50_22
  rated_payload_kg: 50.0          # HDR50-22 (HH050) nominal payload
  gripper:                        # V4.4 suction cup (pac_bringup hdr50_pedestal_gripper.urdf.xacro)
    footprint_m: [0.08, 0.08]     # cup diameter 0.08 m
    tcp_offset_m: 0.06            # flange -> suction face
    mass_kg: 15.0                 # ASSUMPTION (EOAT not selected; conservative)
    clearance_m: 0.01
  cell:
    # base_link world (0, 0, 0.40) - deck centre (0, 1.20, 0.15), in pallet-frame axes (frame turned 180 deg)
    base_from_pallet_center: [0.0, 1.20, 0.25, 3.141592653589793]
    deck_height_m: 0.15
    pick_point_base_m: [-1.08, 1.20, 0.495]            # pick stop (-1.08, 1.20, 0.895) - base_link
  motion:
    approach_clearance_m: 0.30
    path_step_m: 0.05
    max_joint_jump_rad: 0.35
    limit_margin_rad: 0.02
    speed_scale: 0.5
    linear_speed_mps: 0.25
    grip_time_s: 0.5
    release_time_s: 0.5
  collision:                      # capsule radii: ASSUMPTION
    upper_arm_radius_m: 0.16
    forearm_radius_m: 0.13
    wrist_radius_m: 0.10
    sample_step_m: 0.04
